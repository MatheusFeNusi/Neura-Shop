<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Store — GadgetScout</title>
  <meta name="description" content="See every offer we track from a store, compare prices and find the best deal."/>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b5ea8'/%3E%3Ctext x='16' y='22' font-family='Segoe UI,Arial' font-size='17' font-weight='800' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body data-page="loja">

  <div id="app-header"></div>

  <main class="container">
    <nav class="crumb"><a href="index.html">Home</a><span class="sep">›</span><span>Stores</span><span class="sep">›</span><span id="loja-nome"></span></nav>

    <div class="page-head loja-head" id="loja-head"></div>

    <div class="toolbar">
      <span class="count" id="loja-count"></span>
      <label class="visually-hidden" for="loja-ordenar">Sort by</label>
      <select id="loja-ordenar">
        <option value="menor">Price: Low to High</option>
        <option value="maior">Price: High to Low</option>
        <option value="desc">Biggest Discount</option>
        <option value="nota">Top Rated</option>
        <option value="pop">Most Popular</option>
      </select>
    </div>
    <div class="grid-cards" id="loja-grid"></div>
    <div class="pager" id="loja-pager"></div>
  </main>

  <div id="app-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
