<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Browse products — GadgetScout</title>
  <meta name="description" content="Browse tech, audio, smart home and wearables compared across trusted US retailers. Check out securely on the partner store."/>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b5ea8'/%3E%3Ctext x='16' y='22' font-family='Segoe UI,Arial' font-size='17' font-weight='800' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body data-page="categoria">

  <div id="app-header"></div>

  <main class="container">
    <nav class="crumb"><a href="index.html">Home</a><span class="sep">›</span><span>Products</span></nav>

    <div class="page-head" id="cat-head"></div>

    <div class="layout-cat">

      <aside>
        <button class="btn btn-light filtros-toggle" id="filtros-toggle" style="border-color:var(--line)">Show filters</button>
        <form class="filtros" id="filtros-form" onsubmit="return false">
          <h3>Category</h3>
          <div class="fgroup" id="filtro-cat"></div>

          <h3>Rating</h3>
          <div class="fgroup" id="filtro-rend"></div>

          <h3>Price ($)</h3>
          <div class="fgroup">
            <div class="price-range">
              <input type="number" id="fmin" placeholder="Min" min="0"/>
              <span class="range-sep">–</span>
              <input type="number" id="fmax" placeholder="Max" min="0"/>
            </div>
          </div>

          <h3>Availability</h3>
          <div class="fgroup" id="filtro-disp"></div>
        </form>
      </aside>

      <div>
        <div class="toolbar">
          <span class="count" id="cat-count"></span>
          <label class="visually-hidden" for="ordenar">Sort by</label>
          <select id="ordenar">
            <option value="rel">Sort: Featured</option>
            <option value="menor">Price: Low to High</option>
            <option value="maior">Price: High to Low</option>
            <option value="nota">Top Rated</option>
          </select>
        </div>
        <div class="grid-cards" id="cat-grid"></div>
      </div>

    </div>
  </main>

  <div id="app-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
